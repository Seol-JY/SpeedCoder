name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/seol-jy/speedcoder

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build React client
        working-directory: client
        # 의존성은 커밋된 .yarn/cache 에서 오프라인으로 풀린다, 산출물은 server/src/views 로 떨어진다
        run: |
          node .yarn/releases/yarn-3.2.2.cjs install --immutable
          node .yarn/releases/yarn-3.2.2.cjs build

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy hint
        run: |
          echo "seol-gitops 의 apps/speedcoder/kustomization.yaml 에서"
          echo "  newTag: ${{ steps.sha.outputs.short }}"
          echo "로 갱신 후 커밋하면 Argo CD 가 배포합니다."
