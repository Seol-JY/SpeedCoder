name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/seol-jy/speedcoder

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build React client
        working-directory: client
        # 의존성은 커밋된 .yarn/cache 에서 오프라인으로 풀린다, 산출물은 server/src/views 로 떨어진다
        run: |
          node .yarn/releases/yarn-3.2.2.cjs install --immutable
          node .yarn/releases/yarn-3.2.2.cjs build

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: GitOps 태그 갱신
    needs: build
    runs-on: ubuntu-latest
    concurrency: speedcoder-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Seol-JY/seol-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: 이미지 태그 갱신
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)' apps/speedcoder/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "변경 없음"; exit 0; fi
          git commit -am "chore(speedcoder): 이미지 태그 ${TAG} 갱신"
          git push
